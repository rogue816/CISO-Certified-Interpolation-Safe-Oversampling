<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-label="CISO experimental workflow: data loading, hyperparameter tuning on a disjoint suite, hyperparameter lock, single confirmatory evaluation, descriptive analyses, and artefact generation.">
  <title>CISO experimental workflow</title>
  <desc>Preregistered pipeline. Tuning uses five datasets; hyperparameters are locked; the confirmatory evaluation over 37 datasets is then run exactly once. Descriptive analyses follow. All numbers in the paper are regenerated from the frozen result CSVs.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55657a"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b07d2e"/>
    </marker>
  </defs>

  <style>
    .bx   { fill:#f5f7f9; stroke:#c2ccd6; stroke-width:1.2; }
    .core { fill:#eaf2fb; stroke:#6f9fcd; stroke-width:1.4; }
    .gate { fill:#fdf3e3; stroke:#d99a4e; stroke-width:1.6; }
    .out  { fill:#eef6ef; stroke:#82ad84; stroke-width:1.3; }
    .lane { fill:#fbfcfd; stroke:#e2e8ee; stroke-width:1; }
    .h    { font:600 14.5px Helvetica,Arial,sans-serif; fill:#16314d; }
    .hh   { font:700 12px Helvetica,Arial,sans-serif; fill:#7b8794; letter-spacing:1.1px; }
    .t    { font:12.5px Helvetica,Arial,sans-serif; fill:#3d4a57; }
    .s    { font:11.5px Helvetica,Arial,sans-serif; fill:#66737f; }
    .m    { font:11.5px ui-monospace,Menlo,Consolas,monospace; fill:#1f4e79; }
    .mg   { font:11.5px ui-monospace,Menlo,Consolas,monospace; fill:#4d5b69; }
    .ttl  { font:700 19px Helvetica,Arial,sans-serif; fill:#16314d; }
    .sub  { font:13px Helvetica,Arial,sans-serif; fill:#66737f; }
    .gt   { font:600 13px Helvetica,Arial,sans-serif; fill:#8a5a12; }
    .ln   { stroke:#55657a; stroke-width:1.5; fill:none; }
    .lng  { stroke:#b07d2e; stroke-width:1.5; fill:none; stroke-dasharray:5 3; }
  </style>

  <rect x="0" y="0" width="1000" height="880" fill="#ffffff"/>

  <text class="ttl" x="36" y="42">CISO &#8212; experimental workflow</text>
  <text class="sub" x="36" y="64">Certified Interpolation Safe Oversampling. Every stage is fixed by <tspan class="mg">PROTOCOL.md</tspan> before it runs.</text>

  <!-- ============ 0. CORE ============ -->
  <rect class="lane" x="24" y="88" width="952" height="104" rx="7"/>
  <text class="hh" x="40" y="110">CORE IMPLEMENTATION</text>

  <rect class="core" x="40" y="120" width="176" height="56" rx="5"/>
  <text class="m" x="52" y="140">ciso.py</text>
  <text class="s" x="52" y="157">CISO sampler, 3 phases,</text>
  <text class="s" x="52" y="170">certificate &#947;&#7522; = c&#7522; &#8722; r&#7522;</text>

  <rect class="bx" x="248" y="120" width="160" height="56" rx="5"/>
  <text class="m" x="260" y="140">registry.py</text>
  <text class="s" x="260" y="157">17 methods, 5 CISO</text>
  <text class="s" x="260" y="170">variants, library defaults</text>

  <rect class="bx" x="440" y="120" width="160" height="56" rx="5"/>
  <text class="m" x="452" y="140">engine.py</text>
  <text class="s" x="452" y="157">3&#215;5 stratified CV,</text>
  <text class="s" x="452" y="170">4 classifiers</text>

  <rect class="bx" x="632" y="120" width="150" height="56" rx="5"/>
  <text class="m" x="644" y="140">metrics.py</text>
  <text class="s" x="644" y="157">PR-AUC, ROC-AUC,</text>
  <text class="s" x="644" y="170">G-mean, diagnostics</text>

  <rect class="bx" x="814" y="120" width="146" height="56" rx="5"/>
  <text class="m" x="826" y="140">test_ciso.py</text>
  <text class="s" x="826" y="157">30 lemma-derived</text>
  <text class="s" x="826" y="170">tests, all passing</text>

  <path class="ln" d="M 216 148 L 242 148" marker-end="url(#ar)"/>
  <path class="ln" d="M 408 148 L 434 148" marker-end="url(#ar)"/>
  <path class="ln" d="M 600 148 L 626 148" marker-end="url(#ar)"/>

  <!-- ============ 1. DATA ============ -->
  <rect class="lane" x="24" y="208" width="952" height="92" rx="7"/>
  <text class="hh" x="40" y="230">1 &#183; DATA</text>

  <rect class="bx" x="40" y="240" width="208" height="46" rx="5"/>
  <text class="m" x="52" y="258">data/keel/ &#8212; 42 files</text>
  <text class="s" x="52" y="275">37 evaluation + 5 tuning</text>

  <rect class="bx" x="280" y="240" width="190" height="46" rx="5"/>
  <text class="m" x="292" y="258">loaders.py</text>
  <text class="s" x="292" y="275">KEEL parse, UCI fetch</text>

  <rect class="bx" x="502" y="240" width="196" height="46" rx="5"/>
  <text class="m" x="514" y="258">validate_keel.py</text>
  <text class="s" x="514" y="275">n, d, IR self-checks</text>

  <rect class="bx" x="730" y="240" width="230" height="46" rx="5"/>
  <text class="t" x="742" y="258">8 UCI datasets, to IR 194.5</text>
  <text class="s" x="742" y="275">smallest class vs rest</text>

  <path class="ln" d="M 248 263 L 274 263" marker-end="url(#ar)"/>
  <path class="ln" d="M 470 263 L 496 263" marker-end="url(#ar)"/>
  <path class="ln" d="M 698 263 L 724 263" marker-end="url(#ar)"/>

  <!-- ============ 2. TUNE ============ -->
  <rect class="lane" x="24" y="316" width="952" height="92" rx="7"/>
  <text class="hh" x="40" y="338">2 &#183; TUNE &#8212; 5 datasets, disjoint from evaluation</text>

  <rect class="bx" x="40" y="348" width="236" height="46" rx="5"/>
  <text class="m" x="52" y="366">run_tuning.py</text>
  <text class="s" x="52" y="383">90 configs &#215; 5 datasets, batched</text>

  <rect class="out" x="308" y="348" width="214" height="46" rx="5"/>
  <text class="mg" x="320" y="366">tuning_results.csv</text>
  <text class="s" x="320" y="383">27,000 fold-level fits</text>

  <rect class="bx" x="554" y="348" width="236" height="46" rx="5"/>
  <text class="m" x="566" y="366">lock_hyperparameters.py</text>
  <text class="s" x="566" y="383">refuses to lock on partial grid</text>

  <path class="ln" d="M 276 371 L 302 371" marker-end="url(#ar)"/>
  <path class="ln" d="M 522 371 L 548 371" marker-end="url(#ar)"/>

  <!-- ============ GATE ============ -->
  <rect class="gate" x="24" y="424" width="952" height="56" rx="7"/>
  <text class="gt" x="44" y="447">HYPERPARAMETERS LOCKED</text>
  <text class="m" x="44" y="467">k = 7 &#160; &#945; = 2.0 &#160; q = 1.2 &#160; &#946; = 0.1 &#160; &#949;&#8320; = 0.1</text>
  <text class="s" x="470" y="447">Baselines keep library defaults, so the comparison is deliberately</text>
  <text class="s" x="470" y="464">unfavourable to CISO. Nothing below is re-tuned.</text>

  <!-- ============ 3. CONFIRM ============ -->
  <rect class="lane" x="24" y="496" width="952" height="116" rx="7"/>
  <text class="hh" x="40" y="518">3 &#183; CONFIRMATORY EVALUATION &#8212; run exactly once, 37 datasets</text>

  <rect class="bx" x="40" y="528" width="200" height="46" rx="5"/>
  <text class="m" x="52" y="546">run_evaluation.py</text>
  <text class="s" x="52" y="563">17 methods &#215; 4 classifiers</text>

  <rect class="out" x="272" y="528" width="200" height="46" rx="5"/>
  <text class="mg" x="284" y="546">eval_results.csv</text>
  <text class="s" x="284" y="563">37,740 fold-level fits</text>

  <rect class="bx" x="504" y="528" width="456" height="46" rx="5"/>
  <text class="t" x="516" y="546">Q1 predictive &#183; Q2 ablation &#183; Q3 certificate as predictor &#183; Q4 fidelity</text>
  <text class="s" x="516" y="563">Friedman, then Holm-corrected Wilcoxon against the control</text>

  <text class="s" x="40" y="597">Checkpointed and resumable: <tspan class="mg">prepare_resume.py</tspan> rebuilds the resume set, so an interrupted run never silently loses or duplicates folds.</text>

  <path class="ln" d="M 240 551 L 266 551" marker-end="url(#ar)"/>
  <path class="ln" d="M 472 551 L 498 551" marker-end="url(#ar)"/>

  <!-- ============ 4. DESCRIPTIVE ============ -->
  <rect class="lane" x="24" y="628" width="952" height="100" rx="7"/>
  <text class="hh" x="40" y="650">4 &#183; DESCRIPTIVE ANALYSES &#8212; reported as exploratory, not confirmatory</text>

  <rect class="bx" x="40" y="660" width="222" height="54" rx="5"/>
  <text class="m" x="52" y="678">run_fidelity.py</text>
  <text class="s" x="52" y="694">held-out MMD&#178;, principal</text>
  <text class="s" x="52" y="707">angle, C2ST</text>

  <rect class="bx" x="286" y="660" width="222" height="54" rx="5"/>
  <text class="m" x="298" y="678">run_scale.py</text>
  <text class="s" x="298" y="694">8 UCI datasets, runtime</text>
  <text class="s" x="298" y="707">and growth</text>

  <rect class="bx" x="532" y="660" width="222" height="54" rx="5"/>
  <text class="m" x="544" y="678">run_alpha_sweep.py</text>
  <text class="s" x="544" y="694">fidelity&#8211;clearance frontier</text>
  <text class="s" x="544" y="707">over &#945;</text>

  <rect class="bx" x="778" y="660" width="182" height="54" rx="5"/>
  <text class="m" x="790" y="678">toy_visual*.py</text>
  <text class="s" x="790" y="694">certificate panel on</text>
  <text class="s" x="790" y="707">four toy geometries</text>

  <!-- ============ 5. ARTEFACTS ============ -->
  <rect class="lane" x="24" y="744" width="952" height="108" rx="7"/>
  <text class="hh" x="40" y="766">5 &#183; ARTEFACTS</text>

  <rect class="bx" x="40" y="776" width="210" height="46" rx="5"/>
  <text class="m" x="52" y="794">analyze.py</text>
  <text class="s" x="52" y="811">statistics and rank tables</text>

  <rect class="bx" x="282" y="776" width="230" height="46" rx="5"/>
  <text class="m" x="294" y="794">make_paper_figures.py</text>
  <text class="s" x="294" y="811">regenerates every figure</text>

  <rect class="out" x="544" y="776" width="196" height="46" rx="5"/>
  <text class="mg" x="556" y="794">figures/</text>
  <text class="s" x="556" y="811">6 PDFs, paper-ready</text>

  <rect class="out" x="772" y="776" width="188" height="46" rx="5"/>
  <text class="mg" x="784" y="794">tables/</text>
  <text class="s" x="784" y="811">LaTeX, paper-ready</text>

  <path class="ln" d="M 250 799 L 276 799" marker-end="url(#ar)"/>
  <path class="ln" d="M 512 799 L 538 799" marker-end="url(#ar)"/>

  <text class="s" x="40" y="843">Figures and tables are regenerated from the frozen CSVs in <tspan class="mg">results/</tspan>. Those CSVs carry the pre-rename <tspan class="mg">PO-qG</tspan> labels; <tspan class="mg">labels.py</tspan> maps them.</text>

  <!-- vertical flow spine -->
  <path class="ln" d="M 500 192 L 500 202" marker-end="url(#ar)"/>
  <path class="ln" d="M 500 300 L 500 310" marker-end="url(#ar)"/>
  <path class="lng" d="M 500 408 L 500 418" marker-end="url(#arg)"/>
  <path class="lng" d="M 500 480 L 500 490" marker-end="url(#arg)"/>
  <path class="ln" d="M 500 612 L 500 622" marker-end="url(#ar)"/>
  <path class="ln" d="M 500 728 L 500 738" marker-end="url(#ar)"/>
</svg>
