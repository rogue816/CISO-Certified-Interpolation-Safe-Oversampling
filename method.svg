<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="The three phases of CISO: anchor selection by a safety-tilted distribution, neighbour weighting by candidate clearance, and q-Gaussian placement along the segment.">
  <title>CISO: three phases</title>
  <desc>Phase I selects an anchor from a safety-tilted distribution over minority instances. Phase II weights the candidate neighbours by their own clearance. Phase III places the synthetic point along the segment with a q-Gaussian kernel concentrated near the midpoint.</desc>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55657a"/>
    </marker>
  </defs>

  <style>
    .bx  { fill:#f5f7f9; stroke:#c2ccd6; stroke-width:1.2; }
    .ph  { fill:#eaf2fb; stroke:#6f9fcd; stroke-width:1.4; }
    .cf  { fill:#fdf3e3; stroke:#d99a4e; stroke-width:1.4; }
    .ttl { font:700 19px Helvetica,Arial,sans-serif; fill:#16314d; }
    .sub { font:13px Helvetica,Arial,sans-serif; fill:#66737f; }
    .h   { font:600 14px Helvetica,Arial,sans-serif; fill:#16314d; }
    .hh  { font:700 11.5px Helvetica,Arial,sans-serif; fill:#7b8794; letter-spacing:1.1px; }
    .t   { font:12.5px Helvetica,Arial,sans-serif; fill:#3d4a57; }
    .s   { font:11.5px Helvetica,Arial,sans-serif; fill:#66737f; }
    .eq  { font:italic 13px Georgia,'Times New Roman',serif; fill:#1f4e79; }
    .ln  { stroke:#55657a; stroke-width:1.5; fill:none; }
    .gt  { font:600 13px Helvetica,Arial,sans-serif; fill:#8a5a12; }
  </style>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text class="ttl" x="36" y="42">How CISO draws one synthetic point</text>
  <text class="sub" x="36" y="64">Three draws and one affine combination. Each phase is backed by a lemma and by a test in <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">test_ciso.py</tspan>.</text>

  <!-- precompute -->
  <rect class="bx" x="36" y="88" width="928" height="74" rx="6"/>
  <text class="hh" x="52" y="110">PRECOMPUTE, ONCE PER FIT</text>
  <text class="t" x="52" y="132">For each minority instance <tspan class="eq">i</tspan>: majority clearance <tspan class="eq">c&#7522;</tspan>, neighbourhood radius <tspan class="eq">r&#7522;</tspan>, regional density <tspan class="eq">&#961;</tspan><tspan class="eq" font-size="10" dy="3">Reg</tspan><tspan class="eq" dy="-3">(i)</tspan>.</text>
  <text class="t" x="52" y="151">Safety score <tspan class="eq">s&#7522; = &#265;<tspan font-size="10" dy="3">i</tspan><tspan dy="-3"> &#183; (1 &#8722; &#961;</tspan></tspan><tspan class="eq" font-size="10" dy="3">Reg</tspan><tspan class="eq" dy="-3">(i))</tspan>. &#160; Certificate <tspan class="eq">&#947;&#7522; = c&#7522; &#8722; r&#7522;</tspan>; the anchor is certified when <tspan class="eq">&#947;&#7522; &gt; 0</tspan>.</text>

  <!-- phase I -->
  <rect class="ph" x="36" y="186" width="292" height="136" rx="6"/>
  <text class="hh" x="52" y="208">PHASE I &#183; ANCHOR</text>
  <text class="h" x="52" y="230">Pick the anchor</text>
  <text class="eq" x="52" y="256">P<tspan font-size="10" dy="3">&#945;</tspan><tspan dy="-3">(i) &#8733; (&#949;</tspan><tspan font-size="10" dy="3">0</tspan><tspan dy="-3"> + s</tspan><tspan font-size="10" dy="3">i</tspan><tspan dy="-3">)</tspan><tspan font-size="10" dy="-5">&#945;</tspan></text>
  <text class="s" x="52" y="278">Normalized over <tspan font-style="italic">i</tspan>, so the safety</text>
  <text class="s" x="52" y="293">score does change which instance</text>
  <text class="s" x="52" y="308">is chosen. &#945; = 0 recovers uniform.</text>

  <!-- phase II -->
  <rect class="ph" x="354" y="186" width="292" height="136" rx="6"/>
  <text class="hh" x="370" y="208">PHASE II &#183; NEIGHBOUR</text>
  <text class="h" x="370" y="230">Pick a minority neighbour</text>
  <text class="eq" x="370" y="256">P(j | i) &#8733; b<tspan font-size="10" dy="3">ij</tspan><tspan dy="-3"> = G</tspan><tspan font-size="10" dy="3">q</tspan><tspan dy="-3">(d</tspan><tspan font-size="10" dy="3">ij</tspan><tspan dy="-3"> / h</tspan><tspan font-size="10" dy="3">i</tspan><tspan dy="-3">) &#183; &#265;(n</tspan><tspan font-size="10" dy="3">ij</tspan><tspan dy="-3">)</tspan></text>
  <text class="s" x="370" y="278">Normalized over <tspan font-style="italic">j</tspan> with <tspan font-style="italic">i</tspan> fixed, so</text>
  <text class="s" x="370" y="293">only candidate-level quantities</text>
  <text class="s" x="370" y="308">survive. Anchor-level ones cancel.</text>

  <!-- phase III -->
  <rect class="ph" x="672" y="186" width="292" height="136" rx="6"/>
  <text class="hh" x="688" y="208">PHASE III &#183; PLACEMENT</text>
  <text class="h" x="688" y="230">Place along the segment</text>
  <text class="eq" x="688" y="256">&#955; ~ G<tspan font-size="10" dy="3">q</tspan><tspan dy="-3">((&#955; &#8722; &#956;</tspan><tspan font-size="10" dy="3">i</tspan><tspan dy="-3">) / &#946;) on [0, 1]</tspan></text>
  <text class="s" x="688" y="278">Unimodal at <tspan font-style="italic">&#956;&#7522;</tspan>. As <tspan font-style="italic">&#946;</tspan> &#8594; 0 it is a</text>
  <text class="s" x="688" y="293">point mass; as <tspan font-style="italic">&#946;</tspan> &#8594; &#8734; it is uniform,</text>
  <text class="s" x="688" y="308">which is the SMOTE placement.</text>

  <path class="ln" d="M 328 254 L 348 254" marker-end="url(#a2)"/>
  <path class="ln" d="M 646 254 L 666 254" marker-end="url(#a2)"/>
  <path class="ln" d="M 500 162 L 500 180" marker-end="url(#a2)"/>

  <!-- output -->
  <rect class="bx" x="36" y="346" width="928" height="60" rx="6"/>
  <text class="hh" x="52" y="368">OUTPUT</text>
  <text class="t" x="52" y="392">The synthetic point is <tspan class="eq">x&#772; = (1 &#8722; &#955;) x&#7522; + &#955; x&#11388;</tspan>, a convex combination of two minority instances.</text>

  <!-- guarantee -->
  <rect class="cf" x="36" y="422" width="928" height="68" rx="6"/>
  <text class="gt" x="52" y="446">WHAT THE CERTIFICATE BUYS</text>
  <text class="t" x="52" y="468">If the anchor is certified, every point generated from it keeps a positive distance from the majority class.</text>
  <text class="s" x="52" y="484">Convexity plus the triangle inequality. The guarantee is per anchor, and certified anchors are a minority of anchors on most datasets.</text>
</svg>
